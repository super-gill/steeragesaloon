<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steerage &amp; Saloon</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B4757'/%3E%3Cpath d='M22 10h18l-3 26H25z' fill='%23E9D9B6'/%3E%3Cpath d='M22 10h18l-.9 8H22.9z' fill='%230B141A'/%3E%3Cpath d='M14 33h36v5H14z' fill='%23F7FAFA'/%3E%3Cpath d='M6 38h52l-7 14H13z' fill='%230B141A'/%3E%3Cpath d='M9.5 45h45' stroke='%23D4A851' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css?v=0.13.1">
</head>
<body>
<div class="app">
<header class="band"><div class="band-in">
  <div class="brand" id="brand"></div>
  <div class="clock" id="clock"></div>
  <dl class="stats" id="stats"></dl>
</div></header>
<div class="body">
  <section class="side left" id="leftSide" aria-label="Overview" hidden>
    <div class="sidehead">Overview</div>
    <div class="tabbody" id="leftBody"></div>
  </section>
  <section class="mapcol" aria-label="Chart">
    <div class="map" id="map">
      <div class="world" id="world">
        <svg id="mapsvg" viewBox="0 0 1000 419" preserveAspectRatio="none" aria-label="Chart of the North Atlantic" role="img">
          <rect width="1000" height="419" style="fill:var(--chart-sea)"/>
          <path id="grat" style="fill:none;stroke:var(--grat)" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <path id="land" style="fill:var(--chart-land);stroke:var(--coast)" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
          <g id="routesG"></g>
        </svg>
        <div class="ovl" id="portsO"></div>
        <div class="ovl" id="chipsHolder"></div>
        <div class="ovl" id="shipsO"></div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="zoomctl"><button data-act="zoom" data-v="1" aria-label="Zoom in">+</button><button data-act="zoom" data-v="-1" aria-label="Zoom out">−</button><button data-act="zoomfit" aria-label="Fit chart">Fit</button></div>
      <div class="maphint">Drag to pan · scroll or +/− to zoom · click your ships or a route · small coloured markers are rivals</div>
    </div>
    <div class="emergw" id="emergw"></div>
    <div class="designer" id="designer" hidden></div>
  </section>
  <section class="side">
    <nav class="maintabs" role="tablist" id="tabsN" aria-label="Desk"></nav>
    <div class="tabbody" id="tabbody">
      <div class="pane" id="pane-overview"></div>
      <div class="pane" id="pane-fleet" hidden><div class="list" id="fleetL"></div><div id="profileD"></div><div id="detailD" class="stack"></div></div>
      <div class="pane" id="pane-lines" hidden><div class="list" id="linesL"></div><div id="lineD" class="stack"></div></div>
      <div class="pane" id="pane-brokers" hidden></div>
      <div class="pane" id="pane-shore" hidden></div>
      <div class="pane" id="pane-finance" hidden></div>
      <div class="pane" id="pane-company" hidden></div>
    </div>
  </section>
</div>
</div>
<div id="modal"></div>
<script src="js/chart-data.js?v=0.13.1"></script>
<script src="js/data.js?v=0.13.1"></script>
<script src="js/helpers.js?v=0.13.1"></script>
<script src="js/economy.js?v=0.13.1"></script>
<script src="js/lanes.js?v=0.13.1"></script>
<script src="js/wireless.js?v=0.13.1"></script>
<script src="js/silent.js?v=0.13.1"></script>
<script src="js/emergency.js?v=0.13.1"></script>
<script src="js/ledger.js?v=0.13.1"></script>
<script src="js/sim.js?v=0.13.1"></script>
<script src="js/rivals.js?v=0.13.1"></script>
<script src="js/yard.js?v=0.13.1"></script>
<script src="js/naval.js?v=0.13.1"></script>
<script src="js/facilities.js?v=0.13.1"></script>
<script src="js/crew.js?v=0.13.1"></script>
<script src="js/state.js?v=0.13.1"></script>
<script src="js/clock.js?v=0.13.1"></script>
<script src="js/map.js?v=0.13.1"></script>
<script src="js/profile.js?v=0.13.1"></script>
<script src="js/advice.js?v=0.13.1"></script>
<script src="js/design.js?v=0.13.1"></script>
<script src="js/tutorial.js?v=0.13.1"></script>
<script src="js/ui.js?v=0.13.1"></script>
<script src="js/main.js?v=0.13.1"></script>
</body>
</html>
