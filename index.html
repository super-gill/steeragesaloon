<title>Steerage &amp; Saloon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#E6ECEE; --surface:#F7FAFA; --surface2:#EEF3F4; --ink:#13222C; --muted:#56676F; --line:#C4D0D4;
  --brass:#8E6118; --brass-soft:#E9D9B6; --sea:#1B4757; --sea-ink:#EAF2F3; --sea-muted:#A9C3CB;
  --good:#2B6A43; --bad:#A3302A; --warn:#94650F;
  --chart-sea:#C8DBE0; --chart-land:#F2F4EF; --coast:#8AA3AA; --grat:#B3CAD0; --sky:#E2EBED; --marker:#13222C;
  --display:"Poiret One","Didot","Bodoni 72",Georgia,serif;
  --body:"Commissioner","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B141A; --surface:#13202A; --surface2:#182834; --ink:#E0E8EA; --muted:#8FA2AA; --line:#283B46;
    --brass:#D4A851; --brass-soft:#3A301C; --sea:#122F3A; --sea-ink:#E0ECEE; --sea-muted:#86A6B0;
    --good:#6DBA86; --bad:#E57B70; --warn:#DBA945;
    --chart-sea:#0E2430; --chart-land:#1C2D35; --coast:#3E5B66; --grat:#193542; --sky:#152833; --marker:#E6EDEF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B141A; --surface:#13202A; --surface2:#182834; --ink:#E0E8EA; --muted:#8FA2AA; --line:#283B46;
  --brass:#D4A851; --brass-soft:#3A301C; --sea:#122F3A; --sea-ink:#E0ECEE; --sea-muted:#86A6B0;
  --good:#6DBA86; --bad:#E57B70; --warn:#DBA945;
  --chart-sea:#0E2430; --chart-land:#1C2D35; --coast:#3E5B66; --grat:#193542; --sky:#152833; --marker:#E6EDEF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* Header */
.band{background:var(--sea);color:var(--sea-ink);border-bottom:3px double var(--brass);padding-inline:16px}
.band-in{margin:0 auto;padding-block:8px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 30px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:240px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sea-muted);font-weight:600}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;letter-spacing:.02em}
.clock{display:flex;flex-direction:column;gap:4px}
.clock .seg{border-color:#4d6f7c}
.clock .seg button{background:transparent;color:var(--sea-ink);border-right-color:#4d6f7c;min-width:46px}
.clock .seg button[aria-pressed="true"]{background:var(--brass);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0;flex:1;justify-content:flex-end}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats dt,.clock .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea-muted);font-weight:600}
.stats dd{margin:0;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--body);font-size:12px;color:var(--sea-muted)}
.stats dd.neg{color:#F09A90}

/* Layout */
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.rowA{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.rowB{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.fleetgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:1100px){.rowA{grid-template-columns:1fr}.rowB{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.rowB{grid-template-columns:1fr}.brand h1{font-size:30px}.stats{justify-content:flex-start}}
@media (max-width:640px){.fleetgrid{grid-template-columns:1fr}}
.decision{border-left:3px solid var(--bad);gap:8px}
.decision .btn{display:flex;flex-direction:column;gap:2px;font-weight:600}
.decision .btn small{font-weight:400;color:var(--muted);font-size:12px}
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--good) 0 40%,var(--warn) 40% 65%,var(--bad) 65% 100%);opacity:.85}
.gauge b{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:1px;transform:translateX(-50%)}
.gauge b.proj{background:transparent;border:1.5px dashed var(--ink);width:0}
.tier{font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel h3{margin:0;font-size:20px;font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
.warnline{font-size:12.5px;color:var(--warn);margin:0}
.badline{font-size:12.5px;color:var(--bad);margin:0}

/* Map */
.mappanel{padding:0;overflow:hidden;gap:0}
html,body{height:100%}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(380px,36vw,520px)}
.mapcol{position:relative;min-width:0;min-height:0;border-right:1px solid var(--line)}
.app.wide .body{grid-template-columns:clamp(300px,23vw,380px) minmax(0,1fr) clamp(380px,30vw,500px)}
.side.left{border-right:1px solid var(--line)}
.sidehead{flex:none;border-bottom:1px solid var(--line);padding:11px 16px 9px;font-size:13px;font-weight:700;color:var(--ink);border-bottom-color:var(--line);box-shadow:inset 0 -2px 0 var(--brass)}
.map{position:absolute;inset:0;overflow:hidden;background:var(--chart-sea);user-select:none;cursor:grab;touch-action:none}
.map.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0}
.world svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{min-width:34px;height:32px;background:var(--surface);border:1px solid var(--line);border-radius:3px;cursor:pointer;font-weight:700;font-size:15px}
.zoomctl button:last-child{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.zoomctl button:hover{border-color:var(--brass)}
.maphint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:3px 8px;pointer-events:none}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.maintabs{display:flex;flex:none;overflow-x:auto;border-bottom:1px solid var(--line);padding-inline:8px;background:var(--surface)}
.maintabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 10px 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.maintabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.maintabs .badge{background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;line-height:17px;font-weight:700}
.maintabs .count{color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:400}
.tabbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 28px}
.pane{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{border-top:1px solid var(--line);padding-top:14px}
.side h2{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side h3{margin:0;font-size:20px;font-weight:600}
.advice{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface2);border-left:3px solid var(--brass);border-radius:0 3px 3px 0}
.advice.bad{border-left-color:var(--bad)} .advice.warn{border-left-color:var(--warn)}
.advice .note{color:var(--ink);opacity:.85}
.advice .btn{padding:4px 9px;font-size:12px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.alert{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;padding:8px 10px;border-left:3px solid var(--line);background:var(--surface2);font-size:13px}
.alert.bad{border-left-color:var(--bad)} .alert.warn{border-left-color:var(--warn)} .alert.good{border-left-color:var(--good)}
.alert .btn{padding:4px 9px;font-size:12px}
.glist{display:flex;flex-direction:column}
.glance{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.glance:hover{background:var(--surface2)} .glance:focus-visible{outline:2px solid var(--brass)}
.glance .nm{font-weight:600} .glance .mini{width:70px}
#fleetL .item,#linesL .item{padding:7px 10px;gap:3px}
@media (max-width:980px){.body{grid-template-columns:1fr;grid-template-rows:40vh minmax(0,1fr)}.mapcol{border-right:0;border-bottom:1px solid var(--line)}.maphint{display:none}}
.ovl{position:absolute;inset:0;pointer-events:none}
.port{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.port i{display:block;width:7px;height:7px;background:var(--ink);border:1.5px solid var(--chart-land);transform:rotate(45deg)}
.port span{position:absolute;white-space:nowrap;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink);
  text-shadow:0 0 3px var(--chart-sea),0 0 3px var(--chart-sea),0 0 2px var(--chart-sea)}
.chipm{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:2px;background:var(--surface);border:1px solid currentColor;white-space:nowrap}
.chipm.war{color:var(--bad)} .chipm.mail{color:var(--good)}
.shipm{position:absolute;width:0;height:0;pointer-events:auto;cursor:pointer}
.shipm .hit{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%}
.shipm .hull{position:absolute;left:-9px;top:-3.5px;width:18px;height:7px;background:var(--marker);
  clip-path:polygon(0 18%,70% 0,100% 50%,70% 100%,0 82%)}
.shipm.broken .hull{background:var(--bad)} .shipm.yard .hull,.shipm.laid .hull{background:var(--muted)}
.shipm.sel .hit{box-shadow:0 0 0 2px var(--brass)}
.shipm .tag{position:absolute;left:10px;top:6px;white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink);
  text-shadow:0 0 3px var(--chart-sea),0 0 3px var(--chart-sea);pointer-events:none}
.banner{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);padding:8px 10px;font-size:13px;pointer-events:auto;max-width:560px}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.maplegend b{font-weight:600;color:var(--ink)}
.route{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.route.open{stroke:var(--brass);stroke-width:2.2}
.route.closed{stroke:var(--coast);stroke-width:1.2;stroke-dasharray:4 4}
.route.war{stroke:var(--bad);stroke-dasharray:6 3}
.route.selr{stroke-width:4}
.routehit{fill:none;stroke:transparent;stroke-width:16;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:stroke}

/* Lists */
.list{display:flex;flex-direction:column;gap:6px}
.item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:var(--surface2)}
.item[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.item.off{background:transparent}
.item .nm{font-weight:600}
.item:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chip{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:1px 6px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.chip.sea{color:var(--good)} .chip.inport{color:var(--muted)} .chip.yard{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.idle{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}

/* Controls */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.card{display:flex;flex-direction:column;gap:5px;padding:10px;border:1px solid var(--line);border-radius:3px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.danger{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ctl{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
select{background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:7px 8px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{background:var(--surface2);border:0;border-right:1px solid var(--line);padding:6px 10px;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
input[type=number]{width:66px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:5px 6px;font-family:var(--mono)}
.forecast{background:var(--surface2);border:1px dashed var(--line);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

/* Profile */
.profile{width:100%;height:auto;display:block;border-radius:3px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
@media (prefers-reduced-motion:no-preference){
  .smoke circle{animation:drift 2.8s linear infinite}
  .smoke circle:nth-child(2){animation-delay:-.7s}.smoke circle:nth-child(3){animation-delay:-1.4s}.smoke circle:nth-child(4){animation-delay:-2.1s}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-14px,-4px)}}
}

/* Ledger */
.pl{display:grid;align-content:start;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}
.pl .h{grid-column:1/-1;margin-top:6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:3px}
.pl > span:nth-of-type(even){font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.ledgergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:3px double var(--line);padding-top:8px;font-weight:700}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto}
.news li{font-size:13px;padding-left:10px;border-left:3px solid var(--line)}
.news li.hist{border-left-color:var(--brass)} .news li.bad{border-left-color:var(--bad)} .news li.good{border-left-color:var(--good)}
.news time{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,12,16,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .panel{max-width:460px;width:100%}
.modal h3{font-family:var(--display);font-size:32px;font-weight:400}
</style>

<div class="app">
<header class="band"><div class="band-in">
  <div class="brand" id="brand"></div>
  <div class="clock" id="clock"></div>
  <dl class="stats" id="stats"></dl>
</div></header>
<div class="body">
  <section class="side left" id="leftSide" aria-label="Overview" hidden>
    <div class="sidehead">Overview</div>
    <div class="tabbody" id="leftBody"></div>
  </section>
  <section class="mapcol" aria-label="Chart">
    <div class="map" id="map">
      <div class="world" id="world">
        <svg id="mapsvg" viewBox="0 0 1000 419" preserveAspectRatio="none" aria-label="Chart of the North Atlantic" role="img">
          <rect width="1000" height="419" style="fill:var(--chart-sea)"/>
          <path id="grat" style="fill:none;stroke:var(--grat)" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <path id="land" style="fill:var(--chart-land);stroke:var(--coast)" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
          <g id="routesG"></g>
        </svg>
        <div class="ovl" id="portsO"></div>
        <div class="ovl" id="chipsHolder"></div>
        <div class="ovl" id="shipsO"></div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="zoomctl"><button data-act="zoom" data-v="1" aria-label="Zoom in">+</button><button data-act="zoom" data-v="-1" aria-label="Zoom out">−</button><button data-act="zoomfit" aria-label="Fit chart">Fit</button></div>
      <div class="maphint">Drag to pan · scroll or +/− to zoom · click a ship or route</div>
    </div>
  </section>
  <section class="side">
    <nav class="maintabs" role="tablist" id="tabsN" aria-label="Desk"></nav>
    <div class="tabbody" id="tabbody">
      <div class="pane" id="pane-overview"></div>
      <div class="pane" id="pane-fleet" hidden><div class="list" id="fleetL"></div><div id="profileD"></div><div id="detailD" class="stack"></div></div>
      <div class="pane" id="pane-lines" hidden><div class="list" id="linesL"></div><div id="lineD" class="stack"></div></div>
      <div class="pane" id="pane-brokers" hidden></div>
      <div class="pane" id="pane-finance" hidden></div>
      <div class="pane" id="pane-company" hidden></div>
    </div>
  </section>
</div>
</div>

function depart(sh){

function arrive(sh){

    if(lg.pax.t&&lg.pax.t.n>150&&R()<0.02+(spartan?0.04:0)){book('yard',-1500,rk);S.rep=clamp(S.rep-3,0,100);news(`Typhus scare in steerage. SS ${sh.name} held in quarantine off New York.`,'bad');}

function enterYard(sh,k){

/* ================= ADVICE (Mr Ferguson, company secretary) ================= */
function withTemp(sh,rk,patch,shPatch,fn){
  const had=!!S.lines[rk];if(!had)S.lines[rk]={fares:defaultFares(rk),service:1,adv:1,last:[null,null]};
  const L=S.lines[rk],saved={fares:L.fares,service:L.service,adv:L.adv},ss={};
  if(patch){if(patch.fares)L.fares={...L.fares,...patch.fares};if(patch.service!==undefined)L.service=patch.service;if(patch.adv!==undefined)L.adv=patch.adv;}
  if(shPatch)for(const k in shPatch){ss[k]=sh[k];sh[k]=shPatch[k];}
  try{return fn();}finally{L.fares=saved.fares;L.service=saved.service;L.adv=saved.adv;for(const k in ss)sh[k]=ss[k];if(!had)delete S.lines[rk];}
}
function econ(sh,rk,patch,shPatch){
  return withTemp(sh,rk,patch,shPatch,()=>{
    const L=S.lines[rk],w=legCalc(sh,rk,0,null),e=legCalc(sh,rk,1,null),rt=w.seaDays+e.seaDays+8;
    const legNet=l=>l.paxRev+l.cargoRev+l.mail-l.fuelC-l.prov-l.agents-l.port;
    const n=Math.max(1,shipsOn(rk).length);
    const fixed=(crewCost(sh)+insCost(sh)+MAINT_COST[sh.maint]*sh.grt/8000)*rt/30;
    const pax=CL.reduce((a,c)=>a+(w.pax[c]?w.pax[c].n:0)+(e.pax[c]?e.pax[c].n:0),0)*30/rt;
    return {pm:(legNet(w)+legNet(e)-fixed)*30/rt-ADV_COST[L.adv]/n,rev:(w.paxRev+e.paxRev+w.cargoRev+e.cargoRev+w.mail+e.mail)*30/rt,
      fuel:(w.fuelC+e.fuelC)*30/rt,rt,w,e,pax};
  });
}
const lineShips=rk=>S.ships.filter(x=>x.line===rk&&x.state!=='laid');
function lineEcon(rk,patch){let pm=0,pax=0;for(const sh of lineShips(rk)){const q=econ(sh,rk,patch);pm+=q.pm;pax+=q.pax;}return {pm,pax};}
const WINTER=[10,11,0,1];
const money=v=>fmt(Math.round(v/10)*10);
let ADV_CACHE={key:null,list:[]};
function advice(){
  const key=Math.floor(S.t/7)+'|'+S.m+'|'+UI.rev;
  if(ADV_CACHE.key===key)return ADV_CACHE.list;
  const A=[],mo=S.m%12;
  const add=h=>{if((S.dismiss[h.id]||-1)>=S.m)return;A.push(h);};
  // ---- last month review ----
  const LM=S.lastMonth;
  if(LM&&LM.net<0){
    const c=LM.cat,rev=(c.fares||0)+(c.cargo||0)+(c.mail||0);
    const costs=CATS.filter(([k])=>(c[k]||0)<0).map(([k,l])=>[l,-c[k]]).sort((a,b)=>b[1]-a[1]).slice(0,2);
    const lm=LM.m%12,winter=WINTER.includes(lm);
    const worst=Object.keys(LM.lines).filter(k=>ROUTES[k]).sort((a,b)=>LM.lines[a]-LM.lines[b])[0];
    add({id:'review'+LM.m,scope:'co',sev:'bad',gain:1e6,title:`${MONTHS[lm]} lost ${money(-LM.net)}`,
      why:`${costs.map(([l,v])=>`${l} took ${rev>0?Math.round(v/rev*100)+'% of revenue':money(v)}`).join(', ')}.${worst&&LM.lines[worst]<0?` ${ROUTES[worst].name} was the weakest line at ${money(LM.lines[worst])}.`:''}${winter?' Winter is the slack season: first class runs at about half its summer level, so some winter losses are normal. The question is whether summer covers them.':''}`,act:[]});
  }
  // ---- lines ----
  for(const rk of Object.keys(S.lines)){
    const r=ROUTES[rk],L=S.lines[rk],ships=lineShips(rk);if(!ships.length)continue;
    const base=lineEcon(rk),t=S.tension[rk]||0,n=ships.filter(x=>ACTIVE.includes(x.state)).length||1;
    const nextT=f=>{const q=lineEcon(rk,{fares:f});return t+(pressure(rk,{...L.fares,...f},q.pax,n,S.m).p-t)*0.35;};
    const curNext=S.conf?0:nextT({});
    for(const c of CL){
      if(!ships.some(s=>s.berths[c]))continue;
      const ref=r.ref[c],lo=S.conf?confFloor(rk,c):Math.round(ref*0.6),hi=Math.round(ref*1.6),step=Math.max(1,Math.round(ref*0.05));
      let best={f:L.fares[c],pm:base.pm,tn:curNext};
      for(let f=lo;f<=hi;f+=step){if(f===L.fares[c])continue;
        const q=lineEcon(rk,{fares:{[c]:f}});if(q.pm<=best.pm+1)continue;
        const tn=S.conf||c==='tt'?0:nextT({[c]:f});
        if(!S.conf&&tn>=40&&curNext<40&&f<L.fares[c])continue; // don't advise a cut that starts a war
        best={f,pm:q.pm,tn};}
      const gain=best.pm-base.pm;
      if(best.f!==L.fares[c]&&gain>=120){
        const up=best.f>L.fares[c],ld=L.last[0]&&L.last[0].pax[c];
        add({id:`fare:${rk}:${c}`,scope:'line',ref:rk,sev:'tip',gain,
          title:`${up?'Raise':'Cut'} ${CL_NAME[c]} to £${best.f} on ${r.name}`,
          why:up?`${ld&&ld.n>=ld.cap*0.95?'Your '+CL_NAME[c].toLowerCase()+' berths are selling out, so you are turning passengers away. ':''}The market will bear more than £${L.fares[c]}.`
                :`${ld?`Only ${ld.n} of ${ld.cap} ${CL_NAME[c].toLowerCase()} berths sold westbound last time. `:''}At £${L.fares[c]} against a line rate of £${ref}, you are pricing passengers off your ships.${!S.conf&&best.tn>=40?` Careful: this pushes conference tension to about ${Math.round(best.tn)}.`:''}`,
          act:[[`Set £${best.f}`,'setfare',rk,c,best.f]]});
      }
    }
    // tension relief
    if(!S.conf&&!S.wars[rk]&&curNext>=40){
      let fix=null;for(let k=1;k<=12&&!fix;k++){const f={};for(const c of ['f','s','t'])f[c]=Math.max(L.fares[c],Math.round(r.ref[c]*(0.94+k*0.02)));if(nextT(f)<40)fix=f;}
      add({id:`tension:${rk}`,scope:'line',ref:rk,sev:'warn',gain:5e5,title:`Calm the conference on ${r.name}`,
        why:`Tension will be about ${Math.round(curNext)} next month, and above 40 a rate war can break out, cutting rival fares by a quarter for months. Your fares below the line rate${ships.length>1?' and your extra ships':''} are what provoke them.${fix?` Fares of £${fix.f} / £${fix.s} / £${fix.t} would bring it back under 40.`:' Consider joining the conference, or accept the risk.'}`,
        act:fix?[['Set those fares','setfares',rk,fix.f,fix.s,fix.t]]:[['Conference','tabgo','company']]});
    }
    for(const [k,opts,label] of [['adv',[0,1,2,3],'advertising'],['service',[0,1,2],'service']]){
      let best={v:L[k],pm:base.pm};
      for(const v of opts){if(v===L[k])continue;const q=lineEcon(rk,{[k]:v});if(q.pm>best.pm)best={v,pm:q.pm};}
      const gain=best.pm-base.pm;
      if(best.v!==L[k]&&gain>=150){
        const nm=k==='adv'?['no advertising','£300 advertising','£800 advertising','£1,500 advertising'][best.v]:['a Spartan table','a Standard table','a Lavish table'][best.v];
        add({id:`${k}:${rk}`,scope:'line',ref:rk,sev:'tip',gain,title:`Try ${nm} on ${r.name}`,
          why:k==='adv'?(best.v>L.adv?'More advertising would fill enough extra berths to pay for itself.':'Your advertising costs more than the extra passengers it brings.')
            :(best.v===2?'Lavish service fills first class and builds reputation every crossing.':best.v===0?'A Spartan table saves money, but it costs reputation each crossing, and reputation drives first class.':'Standard service balances cost and reputation better here.'),
          act:[['Apply','setlineopt',rk,k,best.v]]});
      }
    }
  }
  // ---- ships ----
  for(const sh of S.ships){
    const r0=sh.line;
    if(sh.state==='laid'){
      let best=null;for(const rk of Object.keys(ROUTES)){const q=econ(sh,rk);if(!best||q.pm>best.pm)best={rk,pm:q.pm};}
      if(best&&best.pm>0&&!WINTER.slice(0,3).includes(mo))add({id:`unlay:${sh.id}`,scope:'ship',ref:sh.id,sev:'warn',gain:best.pm,title:`Put SS ${sh.name} back to work`,
        why:`Laid up she still costs wages and insurance. On ${ROUTES[best.rk].name} she would earn about ${money(best.pm)} a month${!S.lines[best.rk]?' (that line is not open yet)':''}.${mo>=1&&mo<=3?' Spring bookings are picking up.':''}`,
        act:S.lines[best.rk]?[['Assign','moveship',sh.id,best.rk]]:[['View line','selline',best.rk]]});
      continue;
    }
    if(!r0||sh.state==='yard')continue;
    const cur=econ(sh,r0);
    // better route
    let best=null;for(const rk of Object.keys(ROUTES)){if(rk===r0)continue;const q=econ(sh,rk);if(!best||q.pm>best.pm)best={rk,pm:q.pm};}
    if(best&&best.pm-cur.pm>=300)add({id:`move:${sh.id}:${best.rk}`,scope:'ship',ref:sh.id,sev:'tip',gain:best.pm-cur.pm,
      title:`Move SS ${sh.name} to ${ROUTES[best.rk].name}`,
      why:`She makes about ${money(cur.pm)} a month on ${ROUTES[r0].name} but would make about ${money(best.pm)} there, at current fares and season.${!S.lines[best.rk]?' You would need to open that line first (£2,500).':''} Check conference tension there before you commit.`,
      act:S.lines[best.rk]?[['Move her','moveship',sh.id,best.rk]]:[['View line','selline',best.rk]]});
    // winter lay-up
    const idle=0.25*crewCost(sh)+insCost(sh);
    if(WINTER.includes(mo)&&cur.pm<-idle-150&&S.ships.length>1)add({id:`layup:${sh.id}:${S.m}`,scope:'ship',ref:sh.id,sev:'tip',gain:-idle-cur.pm,
      title:`Lay SS ${sh.name} up for the winter`,
      why:`She is losing about ${money(-cur.pm)} a month in the winter trade. Laid up on a skeleton crew she would cost only ${money(idle)}. Bring her back in March.`,
      act:[['Lay up at next port','moveship',sh.id,'']]});
    // speed
    let bs={v:sh.speed,pm:cur.pm};for(const v of [0,1,2]){if(v===sh.speed)continue;const q=econ(sh,r0,null,{speed:v});if(q.pm>bs.pm)bs={v,pm:q.pm};}
    if(bs.v!==sh.speed&&bs.pm-cur.pm>=150&&!(S.mail[r0]&&bs.v===0))add({id:`speed:${sh.id}`,scope:'ship',ref:sh.id,sev:'tip',gain:bs.pm-cur.pm,
      title:`Run SS ${sh.name} at ${['economical','service','full'][bs.v]} speed`,
      why:bs.v===0?'Coal consumption rises with the cube of speed. Slowing down saves more in bunkers than it costs in lost crossings, at a small cost to reputation.':bs.v===2?'The extra crossings and first class appeal outweigh the extra coal, though she wears faster.':'Her current speed is costing more than it earns.',
      act:[['Apply','setship',sh.id,'speed',bs.v]]});
    if(sh.maint===0)add({id:`maint:${sh.id}`,scope:'ship',ref:sh.id,sev:'warn',gain:400,title:`SS ${sh.name} has no maintenance`,
      why:`At ${Math.floor(yearNow()-sh.built)} years old she loses condition every crossing, and nothing slows it. Routine maintenance (${money(MAINT_COST[1]*sh.grt/8000)} a month) postpones costly drydocks and breakdowns.`,
      act:[['Set routine','setship',sh.id,'maint',1]]});
    if(!sh.autoDock&&sh.cond<60)add({id:`thresh:${sh.id}`,scope:'ship',ref:sh.id,sev:'warn',gain:450,title:`SS ${sh.name} has no service threshold`,
      why:`She is at ${Math.round(sh.cond)}% and falling. A threshold sends her to drydock automatically before breakdowns get frequent.`,act:[['Use 50%','setship',sh.id,'autoDock',50]]});
    if(sh.fuel==='coal'&&!sh.pendingYard&&yearNow()-sh.built<28){
      const q=econ(sh,r0,null,{fuel:'oil'}),save=q.pm-cur.pm,cost=refitCost(sh,'oil');
      if(save>0&&cost/save<=30)add({id:`oil:${sh.id}`,scope:'ship',ref:sh.id,sev:'tip',gain:save,title:`Convert SS ${sh.name} to oil`,
        why:`Oil firing cuts her stokehold crew by a third and her bunker bill. It would save about ${money(save)} a month and pay back its ${money(cost)} in about ${Math.ceil(cost/save)} months, but she is out of service for ${YARD_DAYS.oil} days.`,
        act:[['Book the conversion','setyard',sh.id,'oil']]});
    }
  }
  // ---- company ----
  const deps=S.market.map(m=>Math.round(m.price*0.4));
  if(S.market.length&&S.cash-8000>Math.min(...deps)){
    let best=null;
    for(const m of S.market){const dep=Math.round(m.price*0.4);if(S.cash-8000<dep)continue;
      for(const rk of Object.keys(ROUTES)){const q=econ(m,rk);const pay=q.pm-(m.price-dep)*0.065/12;if(!best||pay>best.pay)best={m,rk,pay,dep};}}
    if(best&&best.pay>300)add({id:`buy:${best.m.name}`,scope:'co',sev:'tip',gain:best.pay,title:'Put idle cash to work',
      why:`SS ${best.m.name} (${money(best.dep)} down) could earn about ${money(best.pay)} a month after mortgage interest on ${ROUTES[best.rk].name}. Keep enough cash to survive a bad winter.`,
      act:[['See brokers','tabgo','brokers']]});
  }
  if(S.rep<40&&S.rep>=25)add({id:'rep-mail',scope:'co',sev:'tip',gain:100,title:'Reputation 40 unlocks mail contracts',
    why:`The Post Office only tenders mail to lines with a name (you are at ${Math.round(S.rep)}). A contract pays well over £1,000 a round trip. Lavish tables and punctual, fast crossings build reputation; Spartan tables and breakdowns erode it.`,act:[]});
  if(S.rep<25&&Object.values(S.lines).some(l=>l.service===0))add({id:'rep-low',scope:'co',sev:'warn',gain:300,title:'Your name is suffering',
    why:'Spartan tables cost reputation on every crossing, and reputation is what first class passengers buy. Consider Standard service.',act:[]});
  if(!S.conf&&Object.keys(S.wars).length)add({id:'conf-war',scope:'co',sev:'tip',gain:200,title:'The conference is an option',
    why:'Members cannot be targeted by rate wars. The price is a fare floor at 95% of the line rate and a cap on steerage. Worth it if you keep provoking wars.',act:[['Conference','tabgo','company']]});
  A.sort((a,b)=>b.gain-a.gain);
  ADV_CACHE={key,list:A};
  return A;
}

const $=id=>document.getElementById(id);
/* Patch the DOM in place instead of rebuilding it, so buttons, hover and focus survive live updates. */
const TPL=document.createElement('template');
function sameNode(a,b){if(a.nodeType!==b.nodeType)return false;if(a.nodeType!==1)return true;
  return a.tagName===b.tagName&&a.getAttribute('data-key')===b.getAttribute('data-key')&&a.id===b.id;}
function patchNode(a,b){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  const focused=a===document.activeElement;
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes]){if(focused&&at.name==='value')continue;if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
  const tag=a.tagName;
  if(tag==='INPUT'){if(!focused){if(a.type==='checkbox'||a.type==='radio'){if(a.checked!==b.checked)a.checked=b.checked;}else if(a.value!==b.value)a.value=b.value;}return;}
  if(tag==='TEXTAREA'){if(!focused&&a.value!==b.value)a.value=b.value;return;}
  patchChildren(a,b);
  if(tag==='SELECT'&&!focused){const o=b.querySelector('option[selected]');const v=o?o.value:(a.options[0]?a.options[0].value:'');if(a.value!==v)a.value=v;}
}
function patchChildren(a,b){
  let ai=a.firstChild,bi=b.firstChild;
  while(bi){
    const next=bi.nextSibling;
    if(!ai){a.appendChild(bi);}
    else if(sameNode(ai,bi)){patchNode(ai,bi);ai=ai.nextSibling;}
    else{
      // look ahead for a keyed match so reordered items move instead of being rebuilt
      let m=null;const kb=bi.nodeType===1&&bi.getAttribute('data-key');
      if(kb){for(let x=ai.nextSibling;x;x=x.nextSibling)if(sameNode(x,bi)){m=x;break;}}
      if(m){a.insertBefore(m,ai);patchNode(m,bi);}
      else a.insertBefore(bi,ai);
    }
    bi=next;
  }
  while(ai){const n=ai.nextSibling;a.removeChild(ai);ai=n;}
}
function setHTML(el,h){
  if(el._h===h)return;el._h=h;
  if(el.namespaceURI==='http://www.w3.org/2000/svg'){el.innerHTML=h;return;}
  TPL.innerHTML=h;patchChildren(el,TPL.content);
}
const keyOf=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'k'+(h>>>0).toString(36);};
const condBar=c=>{const cls=c<40?'low':c<65?'mid':'';return `<div class="bar" aria-hidden="true"><i class="${cls}" style="width:${Math.round(c)}%"></i></div>`;};
const seg=(act,k,v,labels,extra='')=>`<div class="seg" role="group">${labels.map((l,i)=>`<button data-act="${act}" data-k="${k}" data-v="${i}" aria-pressed="${v===i}" ${extra}>${l}</button>`).join('')}</div>`;
const TABS=[['overview','Overview'],['fleet','Fleet'],['lines','Lines'],['brokers','Brokers'],['finance','Finance'],['company','Company']];
function shipStatus(sh){
  if(sh.state==='sea'){const r=ROUTES[sh.legRoute],to=PN[sh.dir===0?r.b:r.a],left=(r.dist-sh.pos)/(sh.knots*SPD[sh.speed]*24*sh.slow*(sh.limp?0.4:1));
    if(sh.incident)return {chip:'<span class="chip bad">Orders needed</span>',short:'Broken down, orders needed',text:`Broken down ${int(sh.incident.nm)} nm from the nearest port, ${to} bound.`};
    if(sh.towed)return {chip:'<span class="chip bad">Under tow</span>',short:`Under tow to ${to}`,text:`Under tow to ${to} at 5 knots, about ${Math.max(1,Math.ceil((r.dist-sh.pos)/120))} days.`};
    if(sh.stopLeft>0)return {chip:'<span class="chip bad">Broken down</span>',short:`Repairing at sea, ${Math.ceil(sh.stopLeft)} days`,text:`Stopped mid-ocean, ${to} bound. Engineers expect ${Math.ceil(sh.stopLeft)} more days.`};
    return {chip:sh.limp?'<span class="chip bad">Limping</span>':'<span class="chip sea">At sea</span>',short:`${to} bound, ${Math.max(1,Math.ceil(left))} day${Math.max(1,Math.ceil(left))>1?'s':''}`,text:`Bound for ${to}. ${int(sh.pos)} of ${int(r.dist)} nm, about ${Math.max(1,Math.ceil(left))} day${Math.max(1,Math.ceil(left))>1?'s':''} to go.`};}
  if(sh.state==='port')return {chip:'<span class="chip inport">In port</span>',short:`Loading at ${PN[sh.port]}`,text:`Loading at ${PN[sh.port]}. Sails in ${Math.max(1,Math.ceil(sh.portLeft))} day${Math.ceil(sh.portLeft)>1?'s':''}.`};
  if(sh.state==='repo')return {chip:'<span class="chip sea">Positioning</span>',short:`Sailing light to ${PN[sh.repoTo]}`,text:`Sailing light to ${PN[sh.repoTo]}, ${Math.max(1,Math.ceil(sh.repoLeft))} days out.`};
  if(sh.state==='yard')return {chip:'<span class="chip yard">In yard</span>',short:`In yard, ${Math.ceil(sh.yardLeft)} days`,text:`${YARD_NAME[sh.yardKind][0].toUpperCase()+YARD_NAME[sh.yardKind].slice(1)} at ${PN[sh.port]}, ${Math.ceil(sh.yardLeft)} days left.`};
  return {chip:'<span class="chip idle">Laid up</span>',short:`Laid up at ${PN[sh.port]}`,text:`Laid up at ${PN[sh.port]} on a skeleton crew. Assign her to a line to sail.`};
}

/* ---------- Overview ---------- */
function alerts(){
  const A=[];
  for(const sh of S.ships){
    if(sh.incident)A.push({k:'bad',t:`SS ${sh.name} has broken down and needs orders.`,b:[['Give orders','selship',sh.id]]});
    else if(sh.state==='laid')A.push({k:'warn',t:`SS ${sh.name} is laid up at ${PN[sh.port]}, still drawing wages.`,b:[['Assign a line','selship',sh.id]]});
    else if(sh.cond<35&&sh.state!=='yard'&&sh.pendingYard!=='dock')A.push({k:'bad',t:`SS ${sh.name} is dangerously run down at ${Math.round(sh.cond)}%.`,b:[['Send to the yard','selship',sh.id]]});
    else if(!sh.autoDock&&sh.cond<50&&sh.state!=='yard'&&!sh.pendingYard)A.push({k:'warn',t:`SS ${sh.name} is at ${Math.round(sh.cond)}% and has no service threshold.`,b:[['Review','selship',sh.id]]});
    if(sh.dockWarn&&sh.state!=='yard')A.push({k:'warn',t:`SS ${sh.name} is due a drydock the account cannot cover.`,b:[['Bank','tabgo','finance']]});
  }
  if(S.offer)A.push({k:'good',t:`The Post Office offers ${fmt(S.offer.pay)} per round trip for the ${ROUTES[S.offer.route].name} mail. Miss a month and you are warned; miss two and it goes.`,b:[['Accept','accept'],['Decline','decline']]});
  for(const rk of Object.keys(S.lines)){
    const r=ROUTES[rk],t=S.tension[rk]||0;
    if(S.wars[rk])A.push({k:'bad',t:`Rate war on ${r.name}, ${S.wars[rk].left} more month${S.wars[rk].left>1?'s':''}.`,b:[['View line','selline',rk]]});
    else if(t>=40&&!S.conf)A.push({k:'warn',t:`Conference tension is ${tensionWord(t).toLowerCase()} on ${r.name} (${Math.round(t)}).`,b:[['Review fares','selline',rk]]});
    if(!shipsOn(rk).length)A.push({k:'warn',t:`${r.name} is open but has no ships assigned.`,b:[['View line','selline',rk]]});
  }
  if(S.cash<0)A.push({k:'bad',t:'The account is overdrawn. The bank forecloses below −£8,000.',b:[['Bank','tabgo','finance']]});
  return A;
}

/* ---------- Fleet ---------- */
function renderFleet(){
  const items=S.ships.map(sh=>{const st=shipStatus(sh),sel=S.selShip===sh.id,due=sh.cond<(sh.autoDock||50)&&sh.state!=='yard';
    return `<button class="item" data-key="s${sh.id}" data-act="selship" data-id="${sh.id}" aria-pressed="${sel}">
      <span class="row"><span class="nm">SS ${sh.name}</span>${st.chip}</span>
      <span class="row meta"><span>${sh.line?ROUTES[sh.line].name:'No line'}</span><span class="${due?'neg':''}">${Math.round(sh.cond)}%${sh.pendingYard==='dock'?' · drydock booked':''}</span></span></button>`;}).join('');
  setHTML($('fleetL'),`<h2>Fleet · ${S.ships.length} ship${S.ships.length===1?'':'s'}</h2>${items}`);
  const sh=S.ships.find(x=>x.id===S.selShip)||S.ships[0];if(sh){S.selShip=sh.id;renderShipDetail(sh);}
}
function decisionHTML(sh){
  const I=sh.incident;if(!I)return '';
  const r=ROUTES[sh.legRoute],rep=Math.round(sh.grt*0.3),port=PN[I.back?(sh.dir===0?r.a:r.b):(sh.dir===0?r.b:r.a)];
  const refund=Math.round(0.7*sh.load.paxRev);
  return `<div class="card decision"><strong>SS ${sh.name} has broken down, ${int(I.nm)} nm from ${port}</strong>
    <button class="btn" data-act="incident" data-k="wait">Repair at sea<small>About ${I.wait} days adrift · repairs ${fmt(rep)} · passengers furious, reputation −3</small></button>
    <button class="btn" data-act="incident" data-k="tug">Call an ocean tug<small>${fmt(I.tug)} plus repairs · towed to ${port} at 5 knots, then 10 days of engine repairs${I.back?' · all fares refunded':''} · reputation −1</small></button>
    <button class="btn" data-act="incident" data-k="transfer">Hand passengers to a ${RIVALS[I.rival].name} steamer<small>Refund ${fmt(refund)} (70% of fares) · still ${I.wait} days adrift · reputation −1, and a gift to a rival</small></button>
    <p class="note">With no orders within two days, the engineers start repairing at sea.</p></div>`;
}
function renderShipDetail(sh){
  const st=shipStatus(sh),age=Math.floor(yearNow()-sh.built),atSea=sh.state==='sea'||sh.state==='repo';
  setHTML($('profileD'),`<div class="stack" style="gap:8px">${profileSVG(sh,UI.view)}
    <div class="row"><div class="seg" role="group"><button data-act="view" data-v="ext" aria-pressed="${UI.view==='ext'}">Exterior</button><button data-act="view" data-v="cut" aria-pressed="${UI.view==='cut'}">Cutaway</button></div></div>
    ${UI.view==='cut'?legendHTML(sh):''}</div>`);
  const pB=sh.cond<75?(75-sh.cond)/100*0.175:0;
  const lines=Object.keys(S.lines);
  const yb=(k,label,show)=>{if(!show)return '';const c=refitCost(sh,k);
    if(sh.pendingYard===k)return `<button class="btn" data-act="unyard">Cancel ${label.toLowerCase()} order</button>`;
    return `<button class="btn" data-act="yard" data-k="${k}" ${sh.state==='yard'||sh.pendingYard||S.cash<c||S.over?'disabled':''}>${label} · ${fmt(c)} · ${YARD_DAYS[k]} days${atSea?' (on arrival)':''}</button>`;};
  const sellV=Math.round(shipValue(sh)*0.9),scrapV=sh.grt*2;
  let exitH='';
  if(sh.pendingExit)exitH=`<p class="warnline">To be ${sh.pendingExit==='scrap'?'scrapped':'sold'} when she next reaches port.</p><button class="btn" data-act="unexit">Cancel</button>`;
  else if(S.ships.length>1){
    if(UI.confirm==='sell'+sh.id)exitH=`<button class="btn danger" data-act="exit" data-k="sell">Confirm sale · ${fmt(sellV)}</button><button class="btn" data-act="cancel">Keep her</button>`;
    else if(UI.confirm==='scrap'+sh.id)exitH=`<button class="btn danger" data-act="exit" data-k="scrap">Confirm scrapping · ${fmt(scrapV)}</button><button class="btn" data-act="cancel">Keep her</button>`;
    else exitH=`<button class="btn danger" data-act="askexit" data-k="sell" ${S.over?'disabled':''}>Sell · ${fmt(sellV)}</button><button class="btn danger" data-act="askexit" data-k="scrap" ${S.over?'disabled':''}>Scrap · ${fmt(scrapV)}</button>`;
  }
  setHTML($('detailD'),`
    <div><div class="row"><h3>SS ${sh.name}</h3>${st.chip}</div>
    <div class="meta">Built ${sh.built} (${age} years) · ${int(sh.grt)} grt · ${sh.knots} knots · ${sh.fuel}-fired · worth about ${fmt(shipValue(sh))}</div></div>
    <p style="margin:0">${st.text}</p>
    ${decisionHTML(sh)}
    ${adviceHTML(advice().filter(h=>h.scope==='ship'&&h.ref===sh.id))}
    <div class="row meta"><span>Condition ${Math.round(sh.cond)}%</span><span>${pB>0?`About 1 crossing in ${Math.max(2,Math.round(1/pB))} breaks down`:'Reliable'}</span></div>${condBar(sh.cond)}
    ${sh.cond<35?'<p class="badline">Dangerously run down. Fire or foundering is a real risk. Send her to the yard.</p>':''}
    <div class="ctl"><label class="lbl" for="lineSel">Line</label>
      <select id="lineSel" data-shipline="1"><option value="">Laid up</option>${lines.map(rk=>`<option value="${rk}" ${sh.line===rk?'selected':''}>${ROUTES[rk].name}</option>`).join('')}</select>
      <span class="note">${sh.state==='sea'?'A change takes effect when she reaches port.':sh.line&&sh.state==='port'&&sh.port!==ROUTES[sh.line].a&&sh.port!==ROUTES[sh.line].b?'She will sail light to join the line.':'Open more lines in the Lines tab.'}</span></div>
    <div class="grid2">
      <div class="ctl"><span class="lbl">Speed</span>${seg('shipset','speed',sh.speed,['Economical','Service','Full'])}</div>
      <div class="ctl"><span class="lbl">Maintenance</span>${seg('shipset','maint',sh.maint,['None','Routine','Thorough'])}<span class="note">£${int(MAINT_COST[1]*sh.grt/8000)} or £${int(MAINT_COST[2]*sh.grt/8000)} a month</span></div>
    </div>
    <div class="ctl"><span class="lbl">Service threshold</span>${seg('shipset','autoDock',DOCK_TH.indexOf(sh.autoDock),DOCK_TH.map(v=>v?v+'%':'Off'))}
      <span class="note">${sh.autoDock?`She books herself into drydock (${fmt(refitCost(sh,'dock'))}, ${YARD_DAYS.dock} days, +35 condition) at the first port after falling below ${sh.autoDock}%.`:'Off. You must send her to the yard yourself.'} Condition drops every crossing, faster at full speed and with age. Maintenance slows the decline.</span>
      <button class="btn" data-act="alldock" style="width:fit-content">Use ${sh.autoDock?sh.autoDock+'%':'Off'} for the whole fleet</button></div>
    <div class="ctl"><span class="lbl">Shipyard</span><div class="btns">
      ${yb('dock','Drydock overhaul',true)}${yb('oil','Convert to oil',sh.fuel==='coal')}${yb('tourist','Tourist Third refit',S.m>=48&&sh.berths.tt===0&&sh.berths.t>0)}</div>
      ${sh.pendingYard&&sh.pendingYard!=='repair'?`<p class="warnline">Booked into the yard for ${YARD_NAME[sh.pendingYard]} on arrival.</p>`:''}
      ${sh.pendingYard==='repair'?'<p class="badline">Goes straight to the yard for fire repairs on arrival.</p>':''}</div>
    <div class="ctl"><span class="lbl">Retire</span><div class="btns">${exitH||'<span class="note">You cannot retire your only ship.</span>'}</div></div>`);
}

/* ---------- Lines ---------- */
function renderLines(){
  const net=rk=>S.mtd.lines[rk]||0;
  const items=Object.keys(ROUTES).map(rk=>{const r=ROUTES[rk],open=!!S.lines[rk],n=shipsOn(rk).length,sel=S.selLine===rk,t=S.tension[rk]||0;
    const chip=!open?'<span class="chip idle">Not served</span>':S.wars[rk]?'<span class="chip bad">Rate war</span>':t>=40&&!S.conf?`<span class="chip yard">${tensionWord(t)}</span>`:S.mail[rk]?'<span class="chip sea">Mail</span>':'';
    return `<button class="item${open?'':' off'}" data-key="l${rk}" data-act="selline" data-id="${rk}" aria-pressed="${sel}">
      <span class="row"><span class="nm">${r.name}</span>${chip}</span>
      <span class="row meta"><span>${int(r.dist)} nm${open?` · ${n} ship${n===1?'':'s'}`:''}</span>${open?`<span class="num ${net(rk)<0?'neg':'pos'}">${fmt(net(rk))}</span>`:''}</span></button>`;}).join('');
  setHTML($('linesL'),`<h2>Lines · month to date</h2>${items}`);
  renderLineDetail(S.selLine||'hal');
}
function renderLineDetail(rk){
  const r=ROUTES[rk],L=S.lines[rk];
  if(!L){
    setHTML($('lineD'),`<div><h3>${r.name}</h3><div class="meta">${int(r.dist)} nautical miles · line rates £${r.ref.f} / £${r.ref.s} / £${r.ref.t}</div></div>
      <p style="margin:0">${r.blurb}</p>
      <p class="note">Opening a line means setting up booking agents and a pier office at both ends. You then assign ships to it from the Fleet tab.</p>
      <button class="btn primary" data-act="openline" data-id="${rk}" ${S.cash<2500||S.over?'disabled':''} style="width:fit-content">Open this line · £2,500</button>${marketHTML(rk,null)}`);
    return;
  }
  const war=S.wars[rk],ships=shipsOn(rk);
  const rep=ships[0]||S.ships[0];
  const w=legCalc(rep,rk,0,null),e=legCalc(rep,rk,1,null);
  const rows=CL.filter(c=>rep.berths[c]||c==='tt'&&S.ships.some(s=>s.berths.tt)).map(c=>{
    const lr=Math.round(r.ref[c]*(war?war.mult:1));
    const ld=(i)=>{const x=L.last[i];return x&&x.pax[c]?`${int(x.pax[c].n)}/${x.pax[c].cap}`:'–';};
    return `<tr><td>${CL_NAME[c]}</td><td><input type="number" id="fare-${rk}-${c}" data-fare="${c}" min="1" max="500" value="${L.fares[c]}" aria-label="${CL_NAME[c]} fare in pounds"></td>
      <td class="r num">£${lr}${S.conf?`<div class="meta">floor £${confFloor(rk,c)}</div>`:''}</td><td class="r num">${ld(0)}</td><td class="r num">${ld(1)}</td></tr>`;}).join('');
  const rt=w.seaDays+e.seaDays+8;
  const legNet=l=>l.paxRev+l.cargoRev+l.mail-l.fuelC-l.prov-l.agents-l.port;
  const fixed=(crewCost(rep)+insCost(rep)+MAINT_COST[rep.maint]*rep.grt/8000)*rt/30;
  const perMonth=(legNet(w)+legNet(e)-fixed)*30/rt-ADV_COST[L.adv]/Math.max(1,ships.length);
  const fp=l=>CL.filter(c=>l.pax[c]).map(c=>`${CL_NAME[c]} ${int(l.pax[c].n)}`).join(', ');
  const nAct=ships.filter(x=>ACTIVE.includes(x.state)).length;
  const estPax=ships.length?(CL.reduce((a,c)=>a+(w.pax[c]?w.pax[c].n:0)+(e.pax[c]?e.pax[c].n:0),0))*30/rt*Math.max(1,nAct):0;
  setHTML($('lineD'),`
    <div><div class="row"><h3>${r.name}</h3>${war?'<span class="chip bad">Rate war</span>':''}</div><div class="meta">${int(r.dist)} nm · ${ships.length} ship${ships.length===1?'':'s'} · month to date ${fmt(S.mtd.lines[rk]||0)}</div></div>
    <p class="note">${r.blurb}</p>
    ${adviceHTML(advice().filter(h=>h.scope==='line'&&h.ref===rk))}
    ${war?`<p class="badline">The conference lines have cut fares to ${Math.round(war.mult*100)}% of the line rate for ${war.left} more month${war.left>1?'s':''}.</p>`:''}
    ${S.mail[rk]?`<p class="note">Mail contract: ${fmt(S.mail[rk].pay)} per round trip. Ships at economical speed or broken down do not earn it.</p>`:''}
    <div class="tablewrap"><table><thead><tr><th>Class</th><th>Fare £</th><th class="r">Line rate</th><th class="r">Last west</th><th class="r">Last east</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="grid2">
      <div class="ctl"><span class="lbl">Service and table</span>${seg('lineset','service',L.service,['Spartan','Standard','Lavish'])}</div>
      <div class="ctl"><span class="lbl">Advertising · £/month</span>${seg('lineset','adv',L.adv,['None','300','800','1,500'])}</div>
    </div>
    <div class="forecast"><span class="lbl">Next sailing forecast · SS ${rep.name}</span>
      <dl class="kv"><dt>Westbound</dt><dd>${fmt(w.paxRev+w.cargoRev)}</dd><dt>Eastbound</dt><dd>${fmt(e.paxRev+e.cargoRev)}</dd>
      <dt>Round trip</dt><dd>${Math.round(rt)} days</dd><dt><strong>Profit per ship per month</strong></dt><dd class="${perMonth<0?'neg':'pos'}"><strong>${fmt(perMonth)}</strong></dd></dl>
      <p class="note">West: ${fp(w)||'none'}. East: ${fp(e)||'none'}. Before head office costs and bad luck.</p></div>
    ${marketHTML(rk,estPax,Math.max(1,nAct))}
    <div class="ctl"><span class="lbl">Ships on this line</span><div class="btns">${ships.map(s=>`<button class="btn" data-act="selship" data-id="${s.id}">SS ${s.name}</button>`).join('')||'<span class="note">None yet. Assign ships from the Fleet tab.</span>'}</div></div>
    <div class="btns">${UI.confirm==='close'+rk?`<button class="btn danger" data-act="closeline" data-id="${rk}">Confirm: close line</button><button class="btn" data-act="cancel">Keep it</button>`:`<button class="btn danger" data-act="askclose" data-id="${rk}">Close this line</button>`}</div>`);
}
function marketHTML(rk,estPax,n){
  const r=ROUTES[rk],m=S.m,war=S.wars[rk],L=S.lines[rk];
  const ours=L?(S.lastPax[rk]||estPax||0):0,rp=rivalPax(rk,m),tot=ours+rp;
  const f=(v)=>'£'+Math.round(v);
  const rows=ROUTE_RIVALS[rk].map(([id,wt])=>{const x=RIVALS[id],idx=S.rivalIdx[id]||1,wm=war?war.mult:1;
    return `<tr><td>${x.name}<div class="meta">${x.flag}</div></td><td class="r num">${Math.round(wt*rivalUnit(rk,m)/tot*100)}%</td><td class="r num">${f(r.ref.f*idx*wm)}</td><td class="r num">${f(r.ref.s*idx*wm)}</td><td class="r num">${f(r.ref.t*idx*wm)}</td></tr>`;}).join('');
  const me=L?`<tr><td><strong>Morven Line</strong></td><td class="r num"><strong>${Math.round(ours/tot*100)}%</strong></td><td class="r num">${f(effFare(rk,'f'))}</td><td class="r num">${f(effFare(rk,'s'))}</td><td class="r num">${f(effFare(rk,'t'))}</td></tr>`:'';
  let tens='';
  if(L&&!S.conf){
    const t=S.tension[rk]||0,pr=pressure(rk,L.fares,estPax||ours,n||1,m),next=t+(pr.p-t)*0.35;
    tens=`<div class="ctl"><div class="row"><span class="lbl">Conference tension</span><span class="tier ${t>=65?'neg':t>=40?'':'pos'}" style="${t>=40&&t<65?'color:var(--warn)':''}">${tensionWord(t)} · ${Math.round(t)}</span></div>
      <div class="gauge" role="img" aria-label="Tension ${Math.round(t)} of 100"><b style="left:${t}%"></b><b class="proj" style="left:${clamp(next,0,100)}%"></b></div>
      <p class="note">At these fares, about <strong>${Math.round(next)}</strong> next month (dashed). Rate wars start above 40 and grow likely above 65. Tension rises with fares below the line rate, a large market share and extra ships on the route. Rivals here are ${routeAggr(rk)>=1?'aggressive':routeAggr(rk)>=0.8?'watchful':'fairly relaxed'}.</p></div>`;
  } else if(L&&S.conf)tens='<p class="note">Conference member: no rate wars while you keep to the fare floor.</p>';
  return `<div class="ctl"><span class="lbl">Market report · ${L?'last month':'current'}</span>
    <div class="tablewrap"><table><thead><tr><th>Line</th><th class="r">Share</th><th class="r">First</th><th class="r">Second</th><th class="r">Third</th></tr></thead><tbody>${me}${rows}</tbody></table></div></div>${tens}`;
}

/* ---------- Brokers ---------- */
function renderBrokers(){
  const body=S.market.length?S.market.map(sh=>{const dep=Math.round(sh.price*0.4);return `<div class="card" data-key="m${sh.id}">
      <div class="row"><strong>SS ${sh.name}</strong><span class="num">${fmt(sh.price)}</span></div>
      <div class="meta">Built ${sh.built} · ${int(sh.grt)} grt · ${sh.knots} knots · ${sh.fuel} · lying at ${PN[sh.port]}</div>
      <div class="meta">${sh.berths.f} first, ${sh.berths.s} second, ${sh.berths.t} third · ${int(sh.cargo)} t cargo · condition ${sh.cond}%</div>
      ${sh.note?`<div class="meta">${sh.note}</div>`:''}
      <button class="btn" data-act="buy" data-id="${sh.id}" ${S.cash<dep||S.over?'disabled':''} style="width:fit-content">Buy · ${fmt(dep)} down, ${fmt(sh.price-dep)} mortgaged</button></div>`;}).join('')
    :'<p class="note">Nothing on the lists. New ships come up every quarter.</p>';
  setHTML($('pane-brokers'),`<section class="sec"><h2>Ships for sale</h2><p class="note">The brokers send a new list every quarter. The bank mortgages 60% of the price; you pay the rest in cash. Bought ships arrive laid up where they lie.</p>${body}</section>`);
}

/* ---------- Finance ---------- */
function chart(){
  const h=[...S.hist,Math.round(S.cash)];if(h.length<2)return '';
  const W2=320,H2=80,P=6,mn=Math.min(0,...h),mx=Math.max(1,...h);
  const x=i=>P+i*(W2-2*P)/(h.length-1),y=v=>H2-P-(v-mn)/(mx-mn)*(H2-2*P);
  const pts=h.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<div><div class="row"><span class="lbl">Cash since January 1921</span><span class="meta num">high ${fmt(mx)}</span></div>
    <svg class="chart" viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Cash over time"><polygon points="${x(0)},${y(mn)} ${pts} ${x(h.length-1)},${y(mn)}" style="fill:var(--brass-soft)" opacity=".6"/>
    ${mn<0?`<line x1="${P}" x2="${W2-P}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>`:''}
    <polyline points="${pts}" style="fill:none;stroke:var(--brass)" stroke-width="1.8"/><circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="3.5" style="fill:${h[h.length-1]<0?'var(--bad)':'var(--brass)'}"/></svg></div>`;
}
function renderFinance(){
  const c=S.mtd.cat,tot=Object.values(c).reduce((a,b)=>a+b,0);
  const cats=CATS.filter(([k])=>c[k]).map(([k,l])=>`<span>${l}</span><span class="${c[k]<0?'neg':''}">${fmt(c[k])}</span>`).join('');
  const lk=Object.keys(S.mtd.lines).map(k=>`<span>${k==='_office'?'Head office and bank':k==='_idle'?'Laid up and in yard':ROUTES[k].name}</span><span class="${S.mtd.lines[k]<0?'neg':''}">${fmt(S.mtd.lines[k])}</span>`).join('');
  const LM=S.lastMonth,hr=headroom();
  setHTML($('pane-finance'),`
    <section class="sec"><h2>Ledger · ${monthName(S.m)} to date</h2>
      <div class="pl"><div class="h">By account</div>${cats||'<span>Nothing booked yet</span><span></span>'}</div>
      <div class="pl"><div class="h">By line</div>${lk||'<span>Nothing booked yet</span><span></span>'}</div>
      <div class="total"><span>Month to date</span><span class="num ${tot<0?'neg':'pos'}">${fmt(tot)}</span></div>
      ${LM?`<p class="note">${monthName(LM.m)} closed at <span class="num ${LM.net<0?'neg':'pos'}">${fmt(LM.net)}</span>, with ${fmt(LM.repay)} repaid to the bank.</p>`:''}
      ${chart()}</section>
    <section class="sec"><h2>Bank</h2>
      <dl class="kv"><dt>Debt</dt><dd>${fmt(S.debt)}</dd><dt>Interest (6.5%)</dt><dd>${fmt(S.debt*0.065/12)}/mo</dd>
      <dt>Required repayment</dt><dd>${fmt(Math.round(S.debt*0.004))}/mo</dd><dt>Fleet value</dt><dd>${fmt(fleetValue())}</dd><dt>Can still borrow</dt><dd>${fmt(hr)}</dd></dl>
      <div class="btns"><button class="btn" data-act="borrow" ${hr<10000||S.over?'disabled':''}>Borrow £10,000</button>
      <button class="btn" data-act="repay" ${S.cash<Math.min(10000,S.debt)||S.debt<=0||S.over?'disabled':''}>Repay £10,000</button></div>
      <p class="note">The bank lends up to 70% of your fleet's value and forecloses below −£8,000 cash.</p></section>`);
}

/* ---------- Company ---------- */
function renderCompany(){
  const conf=S.conf?`<p style="margin:0"><strong>Member of the North Atlantic conference.</strong></p>
      <ul class="note" style="padding-left:18px;margin:0"><li>Fares may not go below 95% of the line rate.</li><li>Third class limited to 80% of berths.</li><li>Pooled agents add 4% to third class demand.</li><li>No rate wars. Dues £350 a month.</li></ul>
      ${UI.confirm==='leave'?`<div class="btns"><button class="btn danger" data-act="leave">Confirm: leave</button><button class="btn" data-act="cancel">Stay</button></div>`:`<button class="btn" data-act="leave" style="width:fit-content">Leave the conference</button>`}`
    :`<p style="margin:0">You sail as an <strong>independent</strong>. Price as you like, but undercutting the line rate raises conference tension and invites rate wars.</p>
      <p class="note">Joining costs £3,000 plus £350 a month. Members accept a fare floor and a steerage quota in exchange for peace.</p>
      <button class="btn" data-act="join" ${S.cash<3000||S.over?'disabled':''} style="width:fit-content">Join for £3,000</button>`;
  setHTML($('pane-company'),`
    <section class="sec"><h2>North Atlantic conference</h2>${conf}</section>
    <section class="sec"><h2>Rival lines</h2>${Object.entries(RIVALS).map(([id,x])=>`<div class="row"><span>${x.name} <span class="meta">${x.flag}</span></span><span class="meta">${Object.keys(ROUTE_RIVALS).filter(rk=>ROUTE_RIVALS[rk].some(q=>q[0]===id)).map(rk=>ROUTES[rk].name).join(', ')}</span></div>`).join('')}</section>
    <section class="sec"><h2>Settings</h2><label class="check"><input type="checkbox" id="autoP2" data-autop="1" ${UI.autoPause?'checked':''}> Pause the clock on big events</label></section>
    <section class="sec"><h2>Game</h2><div class="btns">${UI.confirm==='new'?`<button class="btn danger" data-act="new">Confirm: start again</button><button class="btn" data-act="cancel">Keep playing</button>`:`<button class="btn" data-act="new">New game</button>`}</div></section>`);
}
function renderModal(){
  const el=$('modal');if(!S.over){el.innerHTML='';return;}
  const nw=netWorth();
  const v=S.over==='bust'?'The bank has foreclosed. The Morven Line is finished.':nw<50000?'You survived the decade, just. The Line limps into the Depression.':
    nw<250000?'A respectable independent line. The big companies know your name.':nw<600000?'A serious force on the Atlantic. The conference would rather have you inside than out.':'A great line. Your flagship is the talk of New York.';
  setHTML(el,`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="panel"><h3 id="mt">${S.over==='bust'?'Foreclosed':'January 1930'}</h3><p style="margin:0">${v}</p>
    <dl class="kv"><dt>Net worth</dt><dd>${fmt(nw)}</dd><dt>Fleet</dt><dd>${S.ships.length}</dd><dt>Reputation</dt><dd>${Math.round(S.rep)}</dd><dt>Reached</dt><dd>${dateLong(S.t)}</dd></dl>
    <button class="btn primary" data-act="newnow">Start a new line</button></div></div>`);
}
function layoutMode(){
  const w=window.innerWidth>=1280;if(w===UI.wide)return;UI.wide=w;
  document.querySelector('.app').classList.toggle('wide',w);$('leftSide').hidden=!w;
  const ov=$('pane-overview');(w?$('leftBody'):$('tabbody')).prepend(ov);
  if(w&&UI.tab==='overview')UI.tab='fleet';
  $('tabsN')._h=null;UI.dirty=true;VIEW.s=null;requestAnimationFrame(applyView);
}
window.addEventListener('resize',layoutMode);
const PANE_RENDER={overview:renderOverview,fleet:renderFleet,lines:renderLines,brokers:renderBrokers,finance:renderFinance,company:renderCompany};
function render(){renderHeader();renderTabs();renderMap();if(UI.wide&&UI.tab!=='overview')renderOverview();PANE_RENDER[UI.tab]();renderModal();}

/* ================= INPUT ================= */
document.addEventListener('click',e=>{
  if(UI.suppressClick&&e.target.closest('#map'))return;
  UI.rev=(UI.rev||0)+1;
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const prevTab=UI.tab;
  const a=b.dataset.act,sh=S.ships.find(x=>x.id===S.selShip),L=S.lines[S.selLine];
  if(a!=='cancel'&&!a.startsWith('ask')&&!['exit','closeline','leave','new'].includes(a))UI.confirm=null;
  switch(a){
    case 'speed':if(!S.over){UI.speed=+b.dataset.v;if(UI.speed>0)UI.banner=null;else UI.banner='Paused.';}break;
    case 'selship':S.selShip=+b.dataset.id;UI.tab='fleet';break;
    case 'selline':S.selLine=b.dataset.id;UI.tab='lines';break;
    case 'tabgo':UI.tab=(UI.wide&&b.dataset.tab==='overview')?UI.tab:b.dataset.tab;break;
    case 'setfare':{const [rk,c,v]=JSON.parse(b.dataset.d);if(S.lines[rk])S.lines[rk].fares[c]=v;break;}
    case 'setfares':{const [rk,f,s2,t]=JSON.parse(b.dataset.d);if(S.lines[rk])Object.assign(S.lines[rk].fares,{f,s:s2,t});break;}
    case 'setlineopt':{const [rk,k,v]=JSON.parse(b.dataset.d);if(S.lines[rk])S.lines[rk][k]=v;break;}
    case 'setship':{const [id,k,v]=JSON.parse(b.dataset.d);const x=S.ships.find(q=>q.id===id);if(x)x[k]=v;break;}
    case 'moveship':{const [id,rk]=JSON.parse(b.dataset.d);const x=S.ships.find(q=>q.id===id);if(x){x.line=rk||null;if(x.line&&x.state==='laid'){x.state='port';x.portLeft=1;}}break;}
    case 'setyard':{const [id,k]=JSON.parse(b.dataset.d);const x=S.ships.find(q=>q.id===id);if(x&&!x.pendingYard){if(x.state==='sea'||x.state==='repo')x.pendingYard=k;else if(S.cash>=refitCost(x,k))enterYard(x,k);}break;}
    case 'dismiss':S.dismiss[b.dataset.id]=S.m+1;break;
    case 'alladvice':UI.allAdvice=!UI.allAdvice;break;
    case 'newline':{const rk=Object.keys(ROUTES).find(k=>!S.lines[k]);if(rk)S.selLine=rk;UI.tab='lines';break;}
    case 'zoom':{const m=$('map');zoomAt(+b.dataset.v>0?1.3:1/1.3,m.clientWidth/2,m.clientHeight/2);break;}
    case 'zoomfit':zoomFit();break;
    case 'view':UI.view=b.dataset.v;break;
    case 'shipset':if(sh){if(b.dataset.k==='autoDock')sh.autoDock=DOCK_TH[+b.dataset.v];else sh[b.dataset.k]=+b.dataset.v;}break;
    case 'alldock':if(sh)S.ships.forEach(x=>x.autoDock=sh.autoDock);break;
    case 'incident':if(sh&&sh.incident)resolveIncident(sh,b.dataset.k);break;
    case 'lineset':if(L)L[b.dataset.k]=+b.dataset.v;break;
    case 'yard':if(sh){const k=b.dataset.k;if(sh.state==='sea'||sh.state==='repo')sh.pendingYard=k;else if(S.cash>=refitCost(sh,k))enterYard(sh,k);}break;
    case 'unyard':if(sh&&sh.pendingYard!=='repair')sh.pendingYard=null;break;
    case 'askexit':UI.confirm=b.dataset.k+sh.id;break;
    case 'exit':if(sh){if(sh.state==='sea'||sh.state==='repo')sh.pendingExit=b.dataset.k;else exitShip(sh,b.dataset.k);}UI.confirm=null;break;
    case 'unexit':if(sh)sh.pendingExit=null;break;
    case 'openline':{const rk=b.dataset.id;if(S.cash>=2500&&!S.lines[rk]){book('office',-2500,rk);S.lines[rk]={fares:defaultFares(rk),service:1,adv:1,last:[null,null]};news(`The Morven Line opens a ${ROUTES[rk].name} service.`,'good');}break;}
    case 'askclose':UI.confirm='close'+b.dataset.id;break;
    case 'closeline':{const rk=b.dataset.id;delete S.lines[rk];delete S.mail[rk];delete S.wars[rk];S.ships.forEach(x=>{if(x.line===rk){x.line=null;}});news(`The ${ROUTES[rk].name} service is closed.`);UI.confirm=null;break;}
    case 'buy':{const s2=S.market.find(x=>x.id===+b.dataset.id);if(s2){const dep=Math.round(s2.price*0.4);if(S.cash>=dep){S.cash-=dep;S.debt+=s2.price-dep;delete s2.price;S.ships.push(s2);S.market=S.market.filter(x=>x!==s2);S.selShip=s2.id;news(`Bought SS ${s2.name}, lying at ${PN[s2.port]}. Assign her to a line.`,'good');}}break;}
    case 'borrow':if(headroom()>=10000){S.debt+=10000;S.cash+=10000;}break;
    case 'repay':{const x=Math.min(10000,S.debt);if(S.cash>=x){S.debt-=x;S.cash-=x;}break;}
    case 'join':if(S.cash>=3000){S.cash-=3000;S.conf=true;S.wars={};S.tension={};news('The Morven Line has joined the North Atlantic conference.','good');}break;
    case 'leave':if(UI.confirm!=='leave')UI.confirm='leave';else{S.conf=false;UI.confirm=null;news('The Morven Line has left the conference. Expect retaliation if you undercut.','bad');}break;
    case 'accept':if(S.offer){S.mail[S.offer.route]={pay:S.offer.pay,strikes:0,ok:false};news(`Mail contract won on ${ROUTES[S.offer.route].name}: ${fmt(S.offer.pay)} per round trip.`,'good');S.offer=null;}break;
    case 'decline':S.offer=null;break;
    case 'new':if(UI.confirm!=='new')UI.confirm='new';else{UI.confirm=null;newGame();}break;
    case 'newnow':newGame();break;
    case 'cancel':UI.confirm=null;break;
  }
  save();UI.dirty=true;
  if(UI.tab!==prevTab){render();UI.dirty=false;$('tabbody').scrollTop=0;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.fare&&S.lines[S.selLine]){S.lines[S.selLine].fares[t.dataset.fare]=clamp(Math.round(+t.value||1),1,500);}
  if(t.dataset.shipline){const sh=S.ships.find(x=>x.id===S.selShip);if(sh){sh.line=t.value||null;if(sh.line&&sh.state==='laid'){sh.state='port';sh.portLeft=1;}}}
  if(t.dataset.autop)UI.autoPause=t.checked;
  t.blur();UI.rev=(UI.rev||0)+1;save();UI.dirty=true;
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.target.closest('input,select,textarea,button')){e.preventDefault();if(S.over)return;
    if(UI.speed>0){UI.last=UI.speed;UI.speed=0;UI.banner='Paused.';}else{UI.speed=UI.last||1;UI.banner=null;}UI.dirty=true;}
});
window.addEventListener('pagehide',()=>save());

S=load();if(!S)newGame();
layoutMode();UI.dirty=true;applyView();requestAnimationFrame(frame);
</script>
